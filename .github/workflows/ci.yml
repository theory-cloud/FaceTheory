name: CI

# Gates are verified once, on the pull request into staging, from a local,
# input-bound evidence record. CI verifies that record and executes no gate.
#
# There is no push trigger: a merge publishes, it does not re-verify. Under
# strict up-to-date merges the merged tree is the tree the pull request already
# verified, so a gate-class push run would repeat work and prove nothing new.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  release-train-promotion:
    name: Release train promotion gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted release gate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          # Run verifier code from the protected staging lane, never from PR-head content.
          ref: refs/heads/staging
      - name: Verify release train promotion path
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          fetch_args=()
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            fetch_args=(--unshallow)
          fi
          git fetch --no-tags "${fetch_args[@]}" origin \
            "+refs/heads/staging:refs/remotes/origin/staging" \
            "+refs/heads/premain:refs/remotes/origin/premain" \
            "+refs/heads/main:refs/remotes/origin/main"

          # A generated release-please branch lives in this repository, so its
          # content can be fetched and compared with the base tree. Fork heads
          # are never fetched; the verifier rejects them before reading content.
          if [[ "${PR_HEAD_REPOSITORY}" == "${GITHUB_REPOSITORY}" && "${PR_HEAD_REF}" == release-please--branches--* ]]; then
            git fetch --no-tags origin \
              "+refs/heads/${PR_HEAD_REF}:refs/remotes/origin/${PR_HEAD_REF}"
          fi

          base_ref_args=()
          case "${PR_BASE_REF}" in
            staging|premain|main)
              base_ref_args=(--base-ref "refs/remotes/origin/${PR_BASE_REF}")
              ;;
          esac

          if [[ ! -x scripts/verify-release-train-promotion.sh ]]; then
            echo "release-train-promotion: SKIP (trusted staging verifier is not present yet; bootstrap PR only)"
            exit 0
          fi

          scripts/verify-release-train-promotion.sh \
            --base "${PR_BASE_REF}" \
            --head "${PR_HEAD_REF}" \
            "${base_ref_args[@]}" \
            --head-sha "${PR_HEAD_SHA}" \
            --github-repository "${GITHUB_REPOSITORY}" \
            --github-head-repository "${PR_HEAD_REPOSITORY}" \
            --pr-title "${PR_TITLE}"

  prerelease-readiness:
    name: Prerelease readiness (staging -> premain)
    if: github.event.pull_request.base.ref == 'premain' && github.event.pull_request.head.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify user-facing conventional commits exist
        run: |
          git fetch origin premain staging --force
          scripts/verify-release-readiness.sh origin/premain origin/staging prerelease

  release-readiness:
    name: Release readiness (PR -> main)
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify user-facing conventional commits exist
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --force
          scripts/verify-release-readiness.sh "origin/${{ github.event.pull_request.base.ref }}" HEAD release

  staging-readiness:
    name: Release readiness (PR -> staging)
    if: github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify the pull request carries promotion-eligible commits
        run: |
          git fetch origin staging --force
          scripts/verify-release-readiness.sh origin/staging HEAD staging

  version-alignment:
    name: Version alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify versions match VERSION
        run: scripts/verify-version-alignment.sh

  rubric:
    # One verify job for the whole gate set. It verifies the committed evidence
    # record for every gate and every tracked proof profile; it provisions no
    # toolchain and executes no gate. A missing, stale or failed record fails
    # here with the exact local collection command.
    #
    # The `rubric` gate keeps a `**` input scope, so an edit to any tool, guard,
    # workflow, doc or record stales it. That is what keeps a tooling edit from
    # escaping the record.
    name: rubric
    if: github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the recorded evidence for every gate and proof profile
        run: bash scripts/evidence/verify-all.sh
