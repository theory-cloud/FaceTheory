name: Promotion hygiene

# Nothing enters the release branches except a pull request from the accepted
# head in this repository. This check needs only the GitHub pull request
# context: it checks out no code, runs no repository command and carries no
# write credential, so it cannot be influenced by the pull request's content.
#
# Accepted heads:
#   - the pull request's head repository must be this repository, so a fork
#     branch named like an accepted head cannot pass by name;
#   - premain takes staging, and the generated release-please RC branch;
#   - main takes premain, and the generated release-please stable branch.
#
# GitHub runs a pull_request workflow from the pull request's merge ref, so the
# head branch's version of this workflow applies and a promotion already carries
# this check. A pull request that edits or deletes the workflow fails closed: the
# edit is in the diff a code owner must approve, and a deleted check never
# reports.
#
# Dispatch path. release-please opens and updates its pull requests with the
# built-in `GITHUB_TOKEN`, and GitHub starts no pull_request workflow for events
# that token causes, so a generated RC or stable pull request never gets this
# context by itself. `workflow_dispatch` is the documented exception: the
# generated-release lane (scripts/sync-release-pr-checks.sh, run by
# prerelease-pr.yml and release-pr.yml) dispatches this workflow against the
# release branch with the pull request number. A dispatched run is bound to the
# pull request head before the head rule is evaluated: the pull request must be
# open, target a release branch, come from this repository, and carry exactly the
# dispatched branch and SHA. The job id is `promotion-hygiene` in both modes, so
# the required context is the same one.
on:
  pull_request:
    branches: ["premain", "main"]
  workflow_dispatch:
    inputs:
      release_pr_number:
        description: "Generated release pull request number this run verifies"
        required: true
        type: string

permissions:
  pull-requests: read

jobs:
  promotion-hygiene:
    name: promotion-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bind a dispatched run to the generated release pull request head
        id: bound
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ inputs.release_pr_number }}
          DISPATCHED_REF_NAME: ${{ github.ref_name }}
          DISPATCHED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if ! [[ "${RELEASE_PR_NUMBER:-}" =~ ^[0-9]+$ ]]; then
            echo "promotion-hygiene: FAIL (release_pr_number must be numeric, got '${RELEASE_PR_NUMBER:-<empty>}')" >&2
            exit 1
          fi
          if ! [[ "${DISPATCHED_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "promotion-hygiene: FAIL (the dispatched SHA is not a lowercase commit id)" >&2
            exit 1
          fi

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${RELEASE_PR_NUMBER}")" || {
            echo "promotion-hygiene: FAIL (cannot read pull request #${RELEASE_PR_NUMBER} in ${REPOSITORY})" >&2
            exit 1
          }

          PR_JSON="${pr_json}" \
            PR_NUMBER="${RELEASE_PR_NUMBER}" \
            REF_NAME="${DISPATCHED_REF_NAME}" \
            REF_SHA="${DISPATCHED_SHA}" \
            REPOSITORY="${REPOSITORY}" \
            python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ["PR_JSON"])
          number = os.environ["PR_NUMBER"]
          ref_name = os.environ["REF_NAME"]
          ref_sha = os.environ["REF_SHA"]
          repository = os.environ["REPOSITORY"]

          def fail(message: str) -> None:
              print(f"promotion-hygiene: FAIL ({message})", file=__import__("sys").stderr)
              raise SystemExit(1)

          base = data.get("base") or {}
          head = data.get("head") or {}
          base_ref = str(base.get("ref") or "")
          head_ref = str(head.get("ref") or "")
          head_repo = str((head.get("repo") or {}).get("full_name") or "")

          if str(data.get("number") or "") != number:
              fail(f"answered pull request {data.get('number')} for requested #{number}")
          if str(data.get("state") or "") != "open":
              fail(f"generated release PR #{number} is {str(data.get('state') or 'unknown')}, not open")
          if base_ref not in ("premain", "main"):
              fail(f"generated release PR #{number} targets {base_ref or '<empty>'}, not a release branch")
          if head_repo != repository:
              fail(f"generated release PR #{number} head repository {head_repo or '<empty>'} != {repository}")
          if head_ref != ref_name:
              fail(f"dispatched ref {ref_name} != generated release PR head {head_ref or '<empty>'}")
          if str(head.get("sha") or "") != ref_sha:
              fail(f"dispatched ref SHA {ref_sha} != generated release PR head {str(head.get('sha') or '<empty>')}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"base_branch={base_ref}\n")
              handle.write(f"head_branch={head_ref}\n")
          PY

      - name: Require an accepted head branch from this repository
        shell: bash
        env:
          BASE_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || steps.bound.outputs.base_branch }}
          HEAD_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || steps.bound.outputs.head_branch }}
          HEAD_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          integration_branch='staging'
          release_branch='premain'
          main_branch='main'
          release_please_premain_head='release-please--branches--premain'
          release_please_main_head='release-please--branches--main'

          if [ "${HEAD_REPOSITORY:-}" != "${BASE_REPOSITORY:-}" ]; then
            echo "promotion-hygiene: FAIL (head repository '${HEAD_REPOSITORY:-<unavailable>}' is not '${BASE_REPOSITORY:-<unknown>}')" >&2
            echo "A head branch name is not enough: a fork branch named like an accepted head must not pass." >&2
            echo "A fork contribution targets a pre-arranged branch agreed with the code owners; a code owner then carries it to ${integration_branch} with locally produced evidence." >&2
            exit 1
          fi

          case "${BASE_BRANCH}" in
            "${release_branch}")
              accepted="${integration_branch} ${release_please_premain_head}"
              ;;
            "${main_branch}")
              accepted="${release_branch} ${release_please_main_head}"
              ;;
            *)
              echo "promotion-hygiene: FAIL (unexpected base branch '${BASE_BRANCH}')" >&2
              exit 1
              ;;
          esac

          for head in ${accepted}; do
            if [ "${HEAD_BRANCH}" = "${head}" ]; then
              echo "promotion-hygiene: PASS (${BASE_BRANCH} <- ${HEAD_BRANCH})"
              exit 0
            fi
          done

          echo "promotion-hygiene: FAIL (${BASE_BRANCH} <- ${HEAD_BRANCH})" >&2
          echo "Nothing enters ${BASE_BRANCH} except a pull request from: ${accepted}." >&2
          echo "A fork contribution targets a pre-arranged branch agreed with the code owners; a code owner then carries it to ${integration_branch} with locally produced evidence." >&2
          exit 1
